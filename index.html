<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EANT-52MD 騰鼎通訊處賓果大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入煙火特效專用套件 confetti-js -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; }
        .bingo-cell { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 sm:p-4 relative overflow-x-hidden">

    <!-- 頂部導航與模式切換 -->
    <header class="w-full max-w-2xl flex justify-between items-center bg-slate-900/90 backdrop-blur p-4 rounded-2xl shadow-xl mb-4 border border-slate-800">
        <div>
            <h1 class="text-xl font-bold text-amber-400 tracking-wider">✨ 騰鼎通訊處賓果大挑戰</h1>
            <p id="user-status" class="text-xs text-slate-400 mt-0.5">尚未加入遊戲</p>
        </div>
        <div class="flex gap-2">
            <button onclick="switchView('player')" id="btn-player" class="px-3 py-1.5 rounded-xl text-sm font-bold bg-amber-500 text-slate-950 transition shadow">玩家模式</button>
            <button onclick="checkHostPassword()" id="btn-host" class="px-3 py-1.5 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 transition border border-slate-700">主持人室</button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="w-full max-w-2xl flex-1 flex flex-col gap-4">

        <!-- 玩家登入與卡片選擇區 -->
        <div id="view-login" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl flex flex-col gap-4">
            <h2 class="text-lg font-bold text-amber-300">加入派對遊戲</h2>
            <div>
                <label class="block text-sm text-slate-300 mb-1">你的名字 / 暱稱：</label>
                <input type="text" id="input-name" placeholder="例如：Fashion小香" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">選擇賓果卡編號 (1 - 90)：</label>
                <input type="number" id="input-card-id" min="1" max="90" value="1" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
            </div>
            <button onclick="joinGame()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black py-3 rounded-xl shadow-lg hover:brightness-110 transition">進入賓果派對</button>
        </div>

        <!-- 玩家遊戲面板 -->
        <div id="view-player" class="hidden flex flex-col gap-4">
            <!-- 最新叫號提示卡 -->
            <div class="bg-gradient-to-r from-amber-600/30 to-yellow-600/30 border border-amber-500/50 p-4 rounded-2xl flex items-center justify-between shadow-lg">
                <div>
                    <span class="text-xs text-amber-300 font-bold tracking-widest uppercase">主持人最新叫號</span>
                    <div id="current-called-display" class="text-xl sm:text-2xl font-black text-amber-400 mt-0.5">等待主持人開牌...</div>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400">當前連線數</span>
                    <div id="player-lines-count" class="text-2xl font-black text-emerald-400">0 條線</div>
                </div>
            </div>

            <!-- BINGO 達成祝賀橫幅 -->
            <div id="bingo-banner" class="hidden bg-gradient-to-r from-emerald-600 to-teal-600 border border-emerald-400 p-3 rounded-xl text-center text-white font-black text-lg shadow-lg animate-bounce">
                🎉 太神啦！成功解鎖新連線！ 🎉
            </div>

            <!-- 賓果卡片本體 (5x5) -->
            <div id="card-container" class="bg-slate-900 p-3 sm:p-4 rounded-2xl border border-slate-800 shadow-2xl transition-all duration-300">
                <div class="flex justify-between items-center mb-3">
                    <h3 id="card-title" class="font-bold text-amber-300 text-sm">卡片 #1</h3>
                    <span class="text-xs text-slate-400">點擊格子劃記（一經勾選無法取消）</span>
                </div>
                <div id="bingo-grid" class="grid grid-cols-5 gap-1.5 sm:gap-2">
                    <!-- 動態生成 25 格 -->
                </div>
            </div>
        </div>

        <!-- 主持人管理室 -->
        <div id="view-host" class="hidden flex flex-col gap-4">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl flex flex-col gap-4">
                <h2 class="text-lg font-bold text-amber-400">主持人控制台</h2>
                <div class="flex flex-wrap gap-2">
                    <button onclick="hostCallNext()" class="flex-1 bg-amber-500 text-slate-950 font-bold py-3 px-4 rounded-xl shadow hover:bg-amber-400 transition">🎲 隨機叫出下一題/號</button>
                    <button onclick="hostResetGame()" class="bg-rose-600/20 text-rose-400 border border-rose-500/30 font-bold py-3 px-4 rounded-xl hover:bg-rose-600/30 transition">🗑️ 重置叫號紀錄</button>
                    <button onclick="hostFullReset()" class="w-full bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow hover:bg-red-600 transition">⚠️ 全局完整重置 (清空所有人並踢回登入區)</button>
                </div>
                <div>
                    <span class="text-xs text-slate-400">已叫過的項目/號碼紀錄：</span>
                    <div id="host-called-history" class="flex flex-wrap gap-1.5 mt-2 max-h-28 overflow-y-auto p-2 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300">
                        無
                    </div>
                </div>
            </div>

            <!-- 即時玩家戰況看板 -->
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl flex flex-col gap-3">
                <h3 class="font-bold text-amber-300 text-sm">🏆 現場玩家即時戰況排行榜（即
