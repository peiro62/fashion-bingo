<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時尚派對 90卡賓果遊戲 (Set EANT-52MD)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for Celebration Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        fashion: {
                            gold: '#D4AF37',
                            rose: '#E8C5C8',
                            roseDark: '#C48B90',
                            dark: '#121212',
                            card: '#1A1A1A',
                            accent: '#F3E5AB'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top center, #2c2428 0%, #121212 70%);
            min-height: 100vh;
            color: #f3f4f6;
            user-select: none;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF6D5 0%, #D4AF37 50%, #AA7C11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .tile-active {
            background: linear-gradient(135deg, rgba(232, 197, 200, 0.25) 0%, rgba(212, 175, 55, 0.3) 100%) !important;
            border-color: #D4AF37 !important;
            box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.5), 0 0 10px rgba(212, 175, 55, 0.3);
            transform: scale(0.97);
        }

        .tile-winning {
            animation: pulse-gold 1.5s infinite alternate;
        }

        @keyframes pulse-gold {
            0% { box-shadow: inset 0 0 15px #D4AF37, 0 0 10px #D4AF37; border-color: #FFF6D5; }
            100% { box-shadow: inset 0 0 25px #FFF6D5, 0 0 20px #D4AF37; border-color: #D4AF37; }
        }

        .stamp-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg);
            pointer-events: none;
            opacity: 0.85;
            animation: stamp-pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes stamp-pop {
            0% { transform: translate(-50%, -50%) scale(2) rotate(0deg); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(-12deg); opacity: 0.85; }
        }

        .btn-shimmer {
            background: linear-gradient(90deg, #D4AF37 0%, #FFF6D5 50%, #D4AF37 100%);
            background-size: 200% auto;
            transition: 0.3s;
        }
        .btn-shimmer:hover {
            background-position: right center;
        }

        .glass-tab {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="font-sans pb-12 flex flex-col justify-between items-center">

    <!-- Header Section -->
    <header class="w-full max-w-2xl px-4 pt-6 pb-4 text-center">
        <div class="inline-block px-3 py-1 mb-2 rounded-full border border-fashion-roseDark/40 bg-fashion-rose/10 text-xs tracking-widest text-fashion-rose font-semibold uppercase">
            Set EANT-52MD • 90 Cards Edition
        </div>
        <h1 class="font-serif text-3xl sm:text-4xl font-extrabold gold-gradient-text tracking-wider uppercase mb-1">
            時尚派對 BINGO
        </h1>
        <p class="text-xs sm:text-sm text-gray-400 font-light">輸入卡片編號（1-90）即可載入專屬賓果卡</p>

        <!-- Mode Switcher Tabs -->
        <div class="flex justify-center gap-2 mt-5 p-1 rounded-full glass-tab max-w-xs mx-auto">
            <button id="tab-player" onclick="switchMode('player')" class="flex-1 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 bg-fashion-gold text-black shadow-md">
                <i class="fa-solid font-bold fa-user mr-1.5"></i>玩家賓果卡
            </button>
            <button id="tab-host" onclick="switchMode('host')" class="flex-1 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 text-gray-300 hover:text-white">
                <i class="fa-solid fa-bullhorn mr-1.5"></i>主持人叫號盤
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-lg px-3 sm:px-4 flex-1">

        <!-- ================= PLAYER VIEW ================= -->
        <div id="player-view" class="space-y-4">
            
            <!-- Card Selector Bar -->
            <div class="bg-fashion-card border gold-border rounded-xl p-3 sm:p-4 card-shadow flex items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <label for="card-num-input" class="text-xs font-bold text-gray-300 uppercase">卡片編號:</label>
                    <div class="relative w-24">
                        <input type="number" id="card-num-input" min="1" max="90" value="1" 
                            class="w-full bg-neutral-900 border gold-border rounded-lg px-3 py-1.5 text-center text-fashion-gold font-bold font-serif text-lg focus:outline-none focus:ring-1 focus:ring-fashion-gold"
                            onchange="loadSpecificCard()" onkeypress="if(event.key==='Enter') loadSpecificCard()">
                    </div>
                    <span class="text-xs text-gray-400">/ 90</span>
                </div>

                <div class="flex gap-1">
                    <button onclick="changeCardNumber(-1)" class="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 border border-gray-700 rounded-lg text-xs font-bold text-gray-200 transition">
                        <i class="fa-solid fa-chevron-left"></i> 上一張
                    </button>
                    <button onclick="changeCardNumber(1)" class="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 border border-gray-700 rounded-lg text-xs font-bold text-gray-200 transition">
                        下一張 <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Game Status & Score Board -->
            <div class="bg-fashion-card border gold-border rounded-xl p-3 sm:p-4 card-shadow flex justify-between items-center">
                <div>
                    <div class="text-xs text-gray-400">目前連線數</div>
                    <div class="text-2xl font-serif font-bold text-fashion-gold flex items-baseline gap-1">
                        <span id="line-count">0</span> <span class="text-xs font-sans text-gray-400 font-normal">條線</span>
                    </div>
                </div>
                
                <div id="bingo-status-badge" class="px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-xs text-gray-400 font-semibold tracking-wide">
                    尚未連線
                </div>

                <button onclick="resetCurrentCardMarks()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-red-950/40 text-fashion-rose hover:bg-red-900/60 border border-fashion-roseDark/30 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrows-rotate"></i> 重置標記
                </button>
            </div>

            <!-- 5x5 Bingo Grid -->
            <div class="bg-fashion-card border gold-border p-2 sm:p-3 rounded-2xl card-shadow">
                <div id="bingo-grid" class="grid grid-cols-5 gap-1.5 sm:gap-2 aspect-square w-full">
                    <!-- 25 Cells rendered dynamically via JS -->
                </div>
            </div>

            <!-- Card Footer Note -->
            <div class="text-center text-[11px] text-gray-500 font-light flex items-center justify-center gap-2">
                <span><i class="fa-solid fa-hand-pointer text-fashion-gold/70 mr-1"></i>點擊方格標記符合的穿搭元素</span>
            </div>
        </div>

        <!-- ================= HOST / CALLER VIEW ================= -->
        <div id="host-view" class="hidden space-y-5">
            
            <!-- Drawn Item Showcase Box -->
            <div class="bg-fashion-card border gold-border rounded-2xl p-6 text-center card-shadow relative overflow-hidden">
                <div class="text-xs font-semibold text-fashion-gold tracking-widest uppercase mb-2">當前叫號項</div>
                
                <div id="current-drawn-display" class="h-28 flex items-center justify-center my-2">
                    <span class="text-xl sm:text-2xl font-serif font-bold text-gray-500 italic">點擊下方按鈕隨機抽號，或直接點選下方清單</span>
                </div>

                <div class="pt-2 flex justify-center gap-3">
                    <button id="draw-btn" onclick="drawNextItem()" class="btn-shimmer text-black font-bold px-6 py-3 rounded-full text-sm shadow-lg hover:scale-105 active:scale-95 transition flex items-center gap-2">
                        <i class="fa-solid fa-dice"></i> 隨機抽號
                    </button>
                    <button onclick="resetHostGame()" class="px-4 py-3 text-xs font-medium rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-600 transition">
                        重置叫號
                    </button>
                </div>
            </div>

            <!-- Drawn Progress Summary -->
            <div class="bg-fashion-card border border-gray-800 rounded-xl p-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider">叫號單總覽 (<span id="drawn-count">0</span>/24)</h3>
                    <span id="draw-progress-text" class="text-xs text-fashion-gold">點擊項目可手動開出/取消</span>
                </div>

                <!-- Call List Grid (All 24 Items) -->
                <div id="host-items-list" class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-72 overflow-y-auto pr-1">
                    <!-- Host items list populated by JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Information -->
    <footer class="mt-8 text-center text-xs text-gray-600 font-light">
        <p>Fashion Party Bingo Game System &copy; 2026 (Set EANT-52MD)</p>
    </footer>

    <!-- Game Logic JavaScript -->
    <script>
        // Full Pool of 24 Fashion & Number Items from Caller Sheet
        const BINGO_ITEMS = [
            "墨鏡", "頭巾/絲巾", "帽子/項鍊", "手鍊/戒指", 
            "耳環/耳骨夾", "腰鏈/皮帶/金屬扣環", "胸針/別針", "格紋/豹紋", 
            "香奈兒元素", "Oversize", "丹寧牛仔", "雛菊元素", 
            "撞色/特殊色", "皮革單品", 
            "1", "2", "3", "5", "6", "7", "8", "9", "10", "11"
        ];

        const FREE_TILE_TEXT = "【FREE】\nGD & Jennie";

        // State Management
        let currentCardIndex = 1;
        let playerMarkedStates = {}; // key: cardNum (1-90), value: array of 25 booleans
        let drawnItems = [];

        // Seeded pseudo-random generator to guarantee 90 unique deterministic cards for Card 1 to 90
        function getCardItems(cardNum) {
            // Use cardNum as seed to shuffle BINGO_ITEMS uniquely for each card
            let items = [...BINGO_ITEMS];
            let seed = cardNum * 1337 + 42;
            
            // Fisher-Yates shuffle with custom LCG seed
            for (let i = items.length - 1; i > 0; i--) {
                seed = (seed * 9301 + 49297) % 233280;
                let rnd = seed / 233280;
                let j = Math.floor(rnd * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }

            let board = [];
            let itemIdx = 0;
            for (let i = 0; i < 25; i++) {
                if (i === 12) {
                    board.push(FREE_TILE_TEXT);
                } else {
                    board.push(items[itemIdx]);
                    itemIdx++;
                }
            }
            return board;
        }

        // Initialize App on Page Load
        window.onload = function() {
            // Initialize marked states for all 90 cards
            for (let i = 1; i <= 90; i++) {
                let marks = Array(25).fill(false);
                marks[12] = true; // FREE center space always marked
                playerMarkedStates[i] = marks;
            }
            loadCard(1);
            initHostView();
        };

        // Switch between Player and Host tabs
        function switchMode(mode) {
            const playerView = document.getElementById('player-view');
            const hostView = document.getElementById('host-view');
            const tabPlayer = document.getElementById('tab-player');
            const tabHost = document.getElementById('tab-host');

            if (mode === 'player') {
                playerView.classList.remove('hidden');
                hostView.classList.add('hidden');
                tabPlayer.className = "flex-1 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 bg-fashion-gold text-black shadow-md";
                tabHost.className = "flex-1 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 text-gray-300 hover:text-white";
            } else {
                playerView.classList.add('hidden');
                hostView.classList.remove('hidden');
                tabHost.className = "flex-1 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 bg-fashion-gold text-black shadow-md";
                tabPlayer.className = "flex-1 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300 text-gray-300 hover:text-white";
            }
        }

        /* ================= PLAYER LOGIC ================= */

        function loadSpecificCard() {
            const input = document.getElementById('card-num-input');
            let val = parseInt(input.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 90) val = 90;
            input.value = val;
            loadCard(val);
        }

        function changeCardNumber(delta) {
            let nextNum = currentCardIndex + delta;
            if (nextNum < 1) nextNum = 90;
            if (nextNum > 90) nextNum = 1;
            document.getElementById('card-num-input').value = nextNum;
            loadCard(nextNum);
        }

        function loadCard(cardNum) {
            currentCardIndex = cardNum;
            renderPlayerGrid();
            checkBingoLines();
        }

        function resetCurrentCardMarks() {
            let marks = Array(25).fill(false);
            marks[12] = true;
            playerMarkedStates[currentCardIndex] = marks;
            renderPlayerGrid();
            checkBingoLines();
        }

        function renderPlayerGrid() {
            const gridEl = document.getElementById('bingo-grid');
            gridEl.innerHTML = '';

            const boardItems = getCardItems(currentCardIndex);
            const marks = playerMarkedStates[currentCardIndex];

            // Calculate winning lines to highlight
            const winPatterns = getWinningLineIndices(marks);
            const winningIndices = new Set(winPatterns.flat());

            boardItems.forEach((itemText, idx) => {
                const cell = document.createElement('div');
                const isMarked = marks[idx];
                const isFree = idx === 12;
                const isWinningTile = winningIndices.has(idx);

                let baseStyle = "relative flex flex-col items-center justify-center text-center p-1 rounded-xl border text-[11px] sm:text-xs font-medium cursor-pointer transition-all duration-200 select-none overflow-hidden aspect-square ";
                
                if (isWinningTile) {
                    baseStyle += "tile-active tile-winning border-fashion-gold ";
                } else if (isMarked) {
                    baseStyle += "tile-active border-fashion-gold/60 ";
                } else {
                    baseStyle += "bg-neutral-900/90 border-gray-800 text-gray-200 hover:border-gray-600 hover:bg-neutral-800 ";
                }

                cell.className = baseStyle;
                cell.onclick = () => toggleTileMark(idx);

                const formattedText = itemText.replace('/', '/\n');
                let contentHTML = `<span class="leading-tight whitespace-pre-line ${isFree ? 'font-serif font-bold text-fashion-gold text-[10px] sm:text-xs' : ''}">${formattedText}</span>`;
                
                if (isMarked && !isFree) {
                    contentHTML += `
                        <div class="stamp-mark text-fashion-roseDark/80">
                            <i class="fa-solid fa-crown text-2xl sm:text-3xl drop-shadow"></i>
                        </div>
                    `;
                } else if (isFree) {
                    contentHTML += `
                        <div class="mt-0.5 text-[8px] px-1 bg-fashion-gold/20 text-fashion-gold rounded-full font-sans">FREE</div>
                    `;
                }

                cell.innerHTML = contentHTML;
                gridEl.appendChild(cell);
            });
        }

        function toggleTileMark(idx) {
            if (idx === 12) return; // FREE cell stays marked
            let marks = playerMarkedStates[currentCardIndex];
            marks[idx] = !marks[idx];
            renderPlayerGrid();
            checkBingoLines();
        }

        function getWinningLineIndices(marks) {
            const lines = [];

            // Rows
            for (let r = 0; r < 5; r++) {
                const rowIndices = [r*5, r*5+1, r*5+2, r*5+3, r*5+4];
                if (rowIndices.every(i => marks[i])) lines.push(rowIndices);
            }

            // Columns
            for (let c = 0; c < 5; c++) {
                const colIndices = [c, c+5, c+10, c+15, c+20];
                if (colIndices.every(i => marks[i])) lines.push(colIndices);
            }

            // Diagonals
            const diag1 = [0, 6, 12, 18, 24];
            if (diag1.every(i => marks[i])) lines.push(diag1);

            const diag2 = [4, 8, 12, 16, 20];
            if (diag2.every(i => marks[i])) lines.push(diag2);

            return lines;
        }

        let previousLineCounts = {};

        function checkBingoLines() {
            const marks = playerMarkedStates[currentCardIndex];
            const winningLines = getWinningLineIndices(marks);
            const newCount = winningLines.length;
            const lineCountEl = document.getElementById('line-count');
            const badgeEl = document.getElementById('bingo-status-badge');

            lineCountEl.innerText = newCount;

            let prevCount = previousLineCounts[currentCardIndex] || 0;
            if (newCount > prevCount) {
                triggerConfetti();
            }
            previousLineCounts[currentCardIndex] = newCount;

            if (newCount >= 5) {
                badgeEl.className = "px-3 py-1.5 rounded-lg bg-fashion-gold text-black font-bold text-xs shadow-lg animate-bounce";
                badgeEl.innerText = "👑 SUPER BINGO!";
            } else if (newCount >= 1) {
                badgeEl.className = "px-3 py-1.5 rounded-lg bg-fashion-rose/20 border border-fashion-rose text-fashion-rose font-bold text-xs";
                badgeEl.innerText = `✨ ${newCount} 線連成!`;
            } else {
                badgeEl.className = "px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-xs text-gray-400 font-semibold";
                badgeEl.innerText = "尚未連線";
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.7 },
                    colors: ['#D4AF37', '#E8C5C8', '#FFFFFF', '#FFD1DC']
                });
            }
        }


        /* ================= HOST / CALLER LOGIC ================= */

        function initHostView() {
            renderHostList();
        }

        function renderHostList() {
            const container = document.getElementById('host-items-list');
            container.innerHTML = '';

            BINGO_ITEMS.forEach(item => {
                const isDrawn = drawnItems.includes(item);
                const chip = document.createElement('div');

                let style = "p-2 rounded-lg text-center text-xs border font-medium transition-all flex items-center justify-center min-h-[44px] cursor-pointer hover:opacity-80 ";
                if (isDrawn) {
                    style += "bg-fashion-gold/20 border-fashion-gold text-fashion-gold font-bold shadow";
                } else {
                    style += "bg-neutral-900 border-gray-800 text-gray-400";
                }

                chip.className = style;
                chip.innerText = item;
                chip.onclick = () => toggleHostItem(item);
                container.appendChild(chip);
            });

            document.getElementById('drawn-count').innerText = drawnItems.length;
        }

        function toggleHostItem(item) {
            const index = drawnItems.indexOf(item);
            if (index > -1) {
                drawnItems.splice(index, 1);
            } else {
                drawnItems.push(item);
                triggerConfetti();
            }
            renderHostList();
            document.getElementById('current-drawn-display').innerHTML = `
                <span class="text-xs text-fashion-rose font-sans font-semibold tracking-wider block mb-1">CURRENTLY CALLED</span>
                <span class="text-2xl sm:text-3xl font-serif font-extrabold text-fashion-gold drop-shadow-md">
                    ${item}
                </span>
            `;
        }

        function drawNextItem() {
            const remaining = BINGO_ITEMS.filter(item => !drawnItems.includes(item));
            const btn = document.getElementById('draw-btn');
            const display = document.getElementById('current-drawn-display');

            if (remaining.length === 0) {
                alert("所有 24 個項目都已經叫號完畢！");
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-50');

            let count = 0;
            const maxIntervals = 15;
            
            const timer = setInterval(() => {
                const tempRand = remaining[Math.floor(Math.random() * remaining.length)];
                display.innerHTML = `<span class="text-xl sm:text-2xl font-serif text-gray-400 opacity-60">${tempRand}</span>`;
                count++;

                if (count >= maxIntervals) {
                    clearInterval(timer);
                    
                    const selected = remaining[Math.floor(Math.random() * remaining.length)];
                    drawnItems.push(selected);

                    display.innerHTML = `
                        <div class="animate-bounce">
                            <span class="text-xs text-fashion-rose font-sans font-semibold tracking-wider block mb-1">NEW DRAWN ITEM</span>
                            <span class="text-3xl sm:text-4xl font-serif font-extrabold text-fashion-gold drop-shadow-md">
                                ${selected}
                            </span>
                        </div>
                    `;

                    renderHostList();
                    triggerConfetti();

                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    document.getElementById('draw-progress-text').innerText = `最新開出: ${selected}`;
                }
            }, 80);
        }

        function resetHostGame() {
            if (confirm("確定要重置主持人叫號紀錄嗎？")) {
                drawnItems = [];
                document.getElementById('current-drawn-display').innerHTML = `
                    <span class="text-xl sm:text-2xl font-serif font-bold text-gray-500 italic">點擊下方按鈕隨機抽號，或直接點選下方清單</span>
                `;
                document.getElementById('draw-progress-text').innerText = "準備就緒";
                renderHostList();
            }
        }
    </script>
</body>
</html>
